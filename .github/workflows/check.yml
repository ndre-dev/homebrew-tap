name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add this checkout as the tap
        run: |
          tap="$(brew --repository)/Library/Taps/ndre-dev/homebrew-tap"
          mkdir -p "$(dirname "$tap")"
          ln -s "$GITHUB_WORKSPACE" "$tap"
          brew trust --tap ndre-dev/tap

      - name: Style
        run: brew style ndre-dev/tap

      # The online audit calls the GitHub API, which rate-limits anonymous
      # requests from shared runners.
      - name: Audit
        env:
          HOMEBREW_NO_INSTALL_FROM_API: 1
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: brew audit --cask --strict --online --tap ndre-dev/tap
